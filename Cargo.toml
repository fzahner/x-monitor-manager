[package]
name = "x-monitor-manager"        # must be unique on crates.io
version = "1.0.0"
edition = "2024"
description = "A TUI for arranging X11 monitors via xrandr, with vim-like controls"
license = "Apache-2.0"
repository = "https://github.com/fzahner/x-monitor-manager"
readme = "README.md"
keywords = ["xrandr", "x11", "monitor", "tui", "display"]   # max 5, each ≤20 chars
categories = ["command-line-utilities"]                      # from crates.io's fixed list
exclude = ["docs/images/*", "tests/fixtures/*"]

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30.2"

[[bin]]
name = "xmm"
path = "src/main.rs"
